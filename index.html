<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TDOP — Tanzania Digital Opportunity Platform</title>
    <meta name="description" content="TDOP connects Tanzanians with verified jobs, internships, scholarships, training, and tenders from trusted institutions. Free, transparent, and built for Tanzania." />
    <meta name="keywords" content="Tanzania, jobs, internships, scholarships, training, tenders, career, opportunities, Dar es Salaam, ajira, masomo, elimu" />
    <meta name="author" content="TDOP" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TDOP — Tanzania Digital Opportunity Platform" />
    <meta property="og:description" content="Find verified jobs, internships, scholarships, and training from trusted institutions across Tanzania." />
    <meta property="og:url" content="https://tdop.tz" />
    <meta property="og:site_name" content="TDOP" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="sw_TZ" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TDOP — Tanzania Digital Opportunity Platform" />
    <meta name="twitter:description" content="Find verified jobs, internships, scholarships, and training from trusted institutions across Tanzania." />

    <!-- Canonical -->
    <link rel="canonical" href="https://tdop.tz" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "TDOP — Tanzania Digital Opportunity Platform",
      "url": "https://tdop.tz",
      "description": "TDOP connects Tanzanians with verified jobs, internships, scholarships, training, and tenders from trusted institutions.",
      "applicationCategory": "Employment",
      "operatingSystem": "Web",
      "inLanguage": ["en", "sw"],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "TZS"
      },
      "publisher": {
        "@type": "Organization",
        "name": "TDOP",
        "url": "https://tdop.tz",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Dar es Salaam",
          "addressCountry": "TZ"
        }
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
